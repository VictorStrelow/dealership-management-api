spring.application.name=concessionaria-api

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:concessionariadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Console H2 disponível em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Personaliza o caminho da UI e da spec JSON
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Ordena os endpoints por metodo HTTP (GET, POST, PUT, DELETE)
springdoc.swagger-ui.operations-sorter=method

# Ordena os grupos/tags em ordem alfabética
springdoc.swagger-ui.tags-sorter=alpha

# Expande as operações ao abrir (false = recolhido por padrão)
springdoc.swagger-ui.doc-expansion=none